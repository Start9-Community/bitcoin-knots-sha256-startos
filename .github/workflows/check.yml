name: check
# Type-check, unit tests and the pinned release-key check, on every push and PR.
# Packaging and publishing are build.yml / tagAndRelease.yml / release.yml (the
# Start9 Community pipeline); the Knots SHA256 binaries themselves are built and
# signed upstream, and the Dockerfile verifies that signature.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (pinned by SHA)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (pinned by SHA)
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      # The same checks as the Makefile's TS_CHECK (there is no `npm run check` script).
      - run: npx tsc --noEmit
      - run: npm test
      - name: pinned key matches the Dockerfile and carries no secret material
        run: |
          set -e
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --import assets/release-keys/*.asc
          gpg --batch --list-secret-keys | grep -q . && { echo "secret key material committed!"; exit 1; }
          for fp in $(sed -n 's/^ENV PINNED_FINGERPRINTS="\(.*\)"/\1/p' Dockerfile); do
            gpg --batch --with-colons --list-keys | grep -q "^fpr:::::::::$fp:" || { echo "no key file for pinned fingerprint $fp"; exit 1; }
            [ -f "assets/release-keys/$fp.asc" ] || { echo "key file for $fp is not named by its fingerprint"; exit 1; }
          done
          echo "pinned key OK"
